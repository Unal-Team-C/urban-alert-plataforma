# Deprovisioning of the shared platform (spec 001, HU-5, RF-012): manual only, with explicit confirmation.
# Refuses to delete anything while a microservice still uses the VPC or the gateway (plan D-009).
# Bootstrap resources (OIDC, workflow role, state bucket) are not managed by Terraform and stay (RF-016).
name: Deprovision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe urban-alert-plataforma para confirmar que quieres eliminar la red y el gateway compartidos"
        required: true
        type: string

concurrency:
  group: urban-alert-plataforma
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"

jobs:
  deprovision:
    name: Deprovision the platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: temporary AWS credentials, no stored keys (RF-014)
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "urban-alert-plataforma" ]; then
            echo "::error::Confirmation missing: type urban-alert-plataforma. Nothing was deleted."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (the AWS role only trusts main). Nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Read state
        id: state
        run: |
          terraform -chdir=infra/plataforma init -input=false
          if [ -z "$(terraform -chdir=infra/plataforma state list)" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "The platform state is empty: nothing to delete."
            exit 0
          fi
          {
            echo "empty=false"
            echo "vpc_id=$(terraform -chdir=infra/plataforma output -raw vpc_id 2>/dev/null || true)"
            echo "api_id=$(terraform -chdir=infra/plataforma output -raw api_id 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Check that no microservice depends on the platform
        if: steps.state.outputs.empty == 'false' && steps.state.outputs.vpc_id != ''
        run: scripts/check-dependents.sh "${{ steps.state.outputs.vpc_id }}" "${{ steps.state.outputs.api_id }}"

      - name: Destroy
        if: steps.state.outputs.empty == 'false'
        run: terraform -chdir=infra/plataforma destroy -input=false -auto-approve

      - name: Summary
        if: always()
        env:
          EMPTY: ${{ steps.state.outputs.empty }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Desaprovisionamiento de la plataforma"
            echo
            if [ "$EMPTY" = "true" ]; then
              echo "No había nada que eliminar (el estado estaba vacío)."
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "Red, NAT, gateway, VPC Link, logs y parámetros SSM eliminados. Los recursos de arranque se conservan; un push a main vuelve a crear la plataforma."
            else
              echo "No se completó: revisa el paso que falló (confirmación, dependientes o destroy)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
